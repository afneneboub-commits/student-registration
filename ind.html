<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="sty.css">
</head>
<body>
   
  <div class="cont">
     <div class="box">
        <h1 class="title">Student Registration &#127800</h1>
        <p class="subtitle">join our programming community</p>


   <form>
    <div class="in">
    <h3>Full Name</h3>
    <input type="text" class="inn" placeholder="Enter your full name">
    <h3>Email Adress</h3>
    <input type="email" class="inn"  placeholder="exemple@email.com">
    <h3>Password</h3>
    <input type="password" class="inn" placeholder="Enter your password">
    <div class="row">
            <h3>Age</h3>
            <input type="number"  placeholder="Your age">
            <h3>Birth Date</h3>
            <input type="date" >

    </div>
    <h3>Gender</h3>
    

    <div class="options">
    <input type="radio" class="ch" name="Gender">Male
    <input type="radio" class="ch"  name="Gender">Female
    </div>
    <h3>Programming interests</h3>
    <div class="options">
        <input type="checkbox"class="ch" >web Development
        <input type="checkbox"class="ch" >AI/ML
        <input type="checkbox"class="ch" >Cybersecurity
        <input type="checkbox"class="ch" >Game Development
    </div>
    <input type="submit" class="button" value="Register Now! &#127775">
   </form>
   </div>
 </div>
</body>
</html>
